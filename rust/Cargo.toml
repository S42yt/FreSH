[package]
name = "fresh-rs"
version = "0.1.0"
edition = "2021"
description = "A Rust core of FreSH, built to be measured against the C one"
license = "GPL-3.0-or-later"

[[bin]]
name = "fresh-rs"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
