name: Build and Release FreSH

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number, year.major.minor, or year.major.minor-prerelease-n'
        required: true
        default: '26.1.0'
      release_type:
        description: 'Release type'
        required: true
        default: 'draft'
        type: choice
        options: [draft, prerelease, release]

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  expectations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Record what real bash does
        shell: bash
        run: |
          bash --version | head -n 1
          chmod +x tests/diff/*.sh
          tests/diff/record.sh bash tests/diff/expected

      - uses: actions/upload-artifact@v4
        with:
          name: bash-expectations
          path: tests/diff/expected
          retention-days: 7

  build:
    runs-on: windows-latest
    needs: expectations
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
          update: true

      - name: Add the Rust target the C linker can use
        shell: bash
        run: |
          rustup target add x86_64-pc-windows-gnu
          rustc --version
          cargo --version

      - name: Resolve version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${{ github.event.inputs.version }}"
            VERSION="${VERSION:-0.0.0-dev}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

          if [[ "$VERSION" == *-* ]]; then
            echo "PRERELEASE=true" >> $GITHUB_ENV
            echo "this is a prerelease: $VERSION"
          else
            echo "PRERELEASE=false" >> $GITHUB_ENV
            echo "this is a release: $VERSION"
          fi

      - name: Stamp version
        shell: bash
        run: |
          sed -i "s/#define FRESH_VERSION \".*\"/#define FRESH_VERSION \"$VERSION\"/" src/shell.h
          sed -i "s/#define FRESH_VERSION \".*\"/#define FRESH_VERSION \"$VERSION\"/" installation/installer.h
          sed -i "s/VALUE \"ProductVersion\", \".*\"/VALUE \"ProductVersion\", \"$VERSION\"/" src/fresh.rc installation/setup.rc

      - name: Build the Rust core
        shell: bash
        run: |
          cd rust/core
          cargo build --release --target x86_64-pc-windows-gnu

      - name: Build with borrow checking and run the suite under it
        timeout-minutes: 10
        shell: msys2 {0}
        run: |
          chmod +x build.sh
          FRESH_EXTRA_CFLAGS=-DFRESH_BORROWS ./build.sh
          ./build/FreSH.exe tests/run.frsh

      - name: Build
        shell: msys2 {0}
        run: |
          ./build.sh
          test -f build/FreSH.exe
          test -f build/FreSH-Setup.exe

      - name: Smoke test
        shell: bash
        run: |
          ./build/FreSH.exe --version
          ./build/FreSH.exe -c 'echo hello from $(pwd)'
          ./build/FreSH.exe -c 'for i in 1 2 3; do echo $i; done'

      - name: Test suite
        timeout-minutes: 10
        shell: bash
        run: ./build/FreSH.exe tests/run.frsh

      - uses: actions/download-artifact@v4
        with:
          name: bash-expectations
          path: tests/diff/expected

      - name: Differential test against bash
        shell: bash
        run: |
          chmod +x tests/diff/*.sh
          tests/diff/record.sh "$PWD/build/FreSH.exe" tests/diff/actual
          tests/diff/compare.sh tests/diff/expected tests/diff/actual

      - name: Checksums
        shell: bash
        run: |
          cd build
          sha256sum FreSH.exe FreSH-Setup.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/attest-build-provenance@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          subject-path: |
            build/FreSH.exe
            build/FreSH-Setup.exe

      - name: Update the package manifests
        if: startsWith(github.ref, 'refs/tags/v') && env.PRERELEASE == 'false'
        shell: bash
        run: |
          cat build/SHA256SUMS.txt
          setup_hash=$(grep -E '[ *]FreSH-Setup\.exe$' build/SHA256SUMS.txt | cut -d' ' -f1)
          plain_hash=$(grep -E '[ *]FreSH\.exe$' build/SHA256SUMS.txt | cut -d' ' -f1)
          echo "setup $setup_hash"
          echo "exe   $plain_hash"
          bash tools/manifests.sh "$VERSION" "$setup_hash" "$plain_hash"
          git diff --stat

      - name: Submit the winget packages
        if: startsWith(github.ref, 'refs/tags/v') && env.PRERELEASE == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "WINGET_TOKEN is not set, so the winget pull requests are not opened"
            echo "see manifests/README.md for opening them by hand"
            exit 0
          fi
          bash tools/winget-submit.sh "$VERSION"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FreSH-${{ env.VERSION }}
          path: |
            build/FreSH.exe
            build/FreSH-Setup.exe
          retention-days: 90

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: FreSH v${{ env.VERSION }}
          draft: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_type == 'draft' }}
          prerelease: ${{ env.PRERELEASE == 'true' || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_type == 'prerelease') }}
          generate_release_notes: true
          files: |
            build/FreSH-Setup.exe
            build/FreSH.exe
            build/SHA256SUMS.txt
          fail_on_unmatched_files: true
