name: Build and Release FreSH

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 2.0.0)'
        required: true
        default: '2.0.0'
      release_type:
        description: 'Release type'
        required: true
        default: 'draft'
        type: choice
        options: [draft, prerelease, release]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
          update: true

      - name: Resolve version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${{ github.event.inputs.version }}"
            VERSION="${VERSION:-0.0.0-dev}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Stamp version
        shell: bash
        run: |
          sed -i "s/#define FRESH_VERSION \".*\"/#define FRESH_VERSION \"$VERSION\"/" src/shell.h
          sed -i "s/#define FRESH_VERSION \".*\"/#define FRESH_VERSION \"$VERSION\"/" installation/installer.h

      - name: Build
        shell: msys2 {0}
        run: |
          chmod +x build.sh
          ./build.sh
          test -f build/FreSH.exe
          test -f build/FreSH-Setup.exe

      - name: Smoke test
        shell: bash
        run: |
          ./build/FreSH.exe --version
          ./build/FreSH.exe -c 'echo hello from $(pwd)'
          ./build/FreSH.exe -c 'for i in 1 2 3; do echo $i; done'

      - uses: actions/upload-artifact@v4
        with:
          name: FreSH-${{ env.VERSION }}
          path: |
            build/FreSH.exe
            build/FreSH-Setup.exe
          retention-days: 90

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: FreSH v${{ env.VERSION }}
          draft: ${{ github.event.inputs.release_type != 'release' }}
          prerelease: ${{ github.event.inputs.release_type == 'prerelease' }}
          generate_release_notes: true
          files: |
            build/FreSH-Setup.exe
            build/FreSH.exe
          fail_on_unmatched_files: true
