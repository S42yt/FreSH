name: Build and Release FreSH

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number, year.major.minor, or year.major.minor-prerelease-n'
        required: true
        default: '26.1.0'
      release_type:
        description: 'Release type'
        required: true
        default: 'draft'
        type: choice
        options: [draft, prerelease, release]

permissions:
  contents: write
  attestations: write
  id-token: write

env:
  INPUT_VERSION: ${{ github.event.inputs.version }}

jobs:
  expectations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Record what real bash does
        shell: bash
        run: |
          bash --version | head -n 1
          chmod +x tests/diff/*.sh
          tests/diff/record.sh bash tests/diff/expected

      - uses: actions/upload-artifact@v4
        with:
          name: bash-expectations
          path: tests/diff/expected
          retention-days: 7

  windows:
    needs: expectations
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            msystem: MINGW64
            packages: mingw-w64-x86_64-gcc
            rust_target: x86_64-pc-windows-gnu
            cc: gcc
            windres: windres
            suffix: ''
          - arch: arm64
            runner: windows-11-arm
            msystem: CLANGARM64
            packages: mingw-w64-clang-aarch64-clang
            rust_target: aarch64-pc-windows-gnullvm
            cc: clang
            windres: llvm-windres
            suffix: '-arm64'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          install: ${{ matrix.packages }}
          update: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Resolve version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${INPUT_VERSION:-0.0.0-dev}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Stamp version
        shell: bash
        run: |
          sed -i "s/#define FRESH_VERSION \".*\"/#define FRESH_VERSION \"$VERSION\"/" src/shell.h
          sed -i "s/#define FRESH_VERSION \".*\"/#define FRESH_VERSION \"$VERSION\"/" installation/installer.h
          sed -i "s/VALUE \"ProductVersion\", \".*\"/VALUE \"ProductVersion\", \"$VERSION\"/" src/fresh.rc installation/setup.rc

      - name: Build the Rust core
        shell: bash
        run: |
          rustc --version
          cd rust/core
          cargo build --release --target ${{ matrix.rust_target }}

      - name: Build with borrow checking
        shell: msys2 {0}
        env:
          CC: ${{ matrix.cc }}
          WINDRES: ${{ matrix.windres }}
          FRESH_RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          chmod +x build.sh
          FRESH_EXTRA_CFLAGS=-DFRESH_BORROWS ./build.sh
          echo "msys TEMP=$TEMP"
          ./build/FreSH.exe --norc -c 'set -x; PATH=""; d="C:\a\_temp\msys64\tmp"; echo hi > "$d\probe.tmp"; echo "write status $?"; test -f "$d\probe.tmp" && echo probe-exists; ls -la "$d\probe.tmp"; cat "$d\probe.tmp"; echo "cat status $?"; cat "C:/a/_temp/msys64/tmp/probe.tmp"; echo "slash cat status $?"; cat probe-missing.txt; echo "missing status $?"; cat <(echo bundled-cat); echo "procsub status $?"' 2>&1 || echo "diagnostic exit $?"

      - name: Run the suite under borrow checking
        timeout-minutes: 10
        shell: bash
        run: |
          echo "bash TEMP=$TEMP"
          ./build/FreSH.exe tests/run.frsh

      - name: Build
        shell: msys2 {0}
        env:
          CC: ${{ matrix.cc }}
          WINDRES: ${{ matrix.windres }}
          FRESH_RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          ./build.sh
          test -f build/FreSH.exe
          test -f build/FreSH-Setup.exe

      - name: Smoke test
        shell: bash
        run: |
          ./build/FreSH.exe --version
          ./build/FreSH.exe -c 'echo hello from $(pwd)'
          ./build/FreSH.exe -c 'for i in 1 2 3; do echo $i; done'
          ./build/FreSH.exe -c 'uname -a'

      - name: Test suite
        timeout-minutes: 10
        shell: bash
        run: ./build/FreSH.exe tests/run.frsh

      - uses: actions/download-artifact@v4
        with:
          name: bash-expectations
          path: tests/diff/expected

      - name: Differential test against bash
        shell: bash
        run: |
          chmod +x tests/diff/*.sh
          tests/diff/record.sh "$PWD/build/FreSH.exe" tests/diff/actual
          tests/diff/compare.sh tests/diff/expected tests/diff/actual

      - name: Name the binaries
        shell: bash
        run: |
          mkdir -p dist
          cp build/FreSH.exe "dist/FreSH${{ matrix.suffix }}.exe"
          cp build/FreSH-Setup.exe "dist/FreSH-Setup${{ matrix.suffix }}.exe"
          ls -la dist

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-${{ matrix.arch }}
          path: dist/*
          retention-days: 90

  macos:
    runs-on: macos-latest
    needs: expectations
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${INPUT_VERSION:-0.0.0-dev}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          sed -i '' "s/#define FRESH_VERSION \".*\"/#define FRESH_VERSION \"$VERSION\"/" src/shell.h

      - name: Build the Rust core
        shell: bash
        run: |
          rustc --version
          rustup target add x86_64-apple-darwin
          cd rust/core
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin

      - name: Build with borrow checking and run the suite under it
        timeout-minutes: 10
        shell: bash
        run: |
          chmod +x build.sh
          FRESH_EXTRA_CFLAGS=-DFRESH_BORROWS ./build.sh
          ./build/fresh tests/run.frsh

      - name: Build
        shell: bash
        run: |
          ./build.sh
          test -f build/fresh
          file build/fresh

      - name: Smoke test
        shell: bash
        run: |
          ./build/fresh --version
          ./build/fresh -c 'echo hello from $(pwd)'
          ./build/fresh -c 'for i in 1 2 3; do echo $i; done | tr 1 x'
          ./build/fresh -c 'uname -s; command -v ls'
          ./build/fresh-setup --silent --user
          test -x "$HOME/.local/bin/fresh"
          "$HOME/.local/bin/fresh" --version
          ./build/fresh-setup --silent --uninstall
          test ! -e "$HOME/.local/bin/fresh"

      - name: Test suite
        timeout-minutes: 10
        shell: bash
        run: ./build/fresh tests/run.frsh

      - uses: actions/download-artifact@v4
        with:
          name: bash-expectations
          path: tests/diff/expected

      - name: Differential test against bash
        shell: bash
        run: |
          chmod +x tests/diff/*.sh
          tests/diff/record.sh "$PWD/build/fresh" tests/diff/actual
          tests/diff/compare.sh tests/diff/expected tests/diff/actual

      - name: Differential test against the bash that ships with macOS
        continue-on-error: true
        shell: bash
        run: |
          /bin/bash --version | head -n 1
          tests/diff/record.sh /bin/bash tests/diff/expected-macos
          tests/diff/compare.sh tests/diff/expected-macos tests/diff/actual

      - name: Build the Intel binary
        shell: bash
        run: |
          mkdir -p dist
          cp build/fresh dist/fresh-macos-arm64
          cp build/fresh-setup dist/fresh-setup-macos-arm64
          FRESH_TARGET_ARCH=x86_64 ./build.sh
          file build/fresh build/fresh-setup
          cp build/fresh dist/fresh-macos-x86_64
          cp build/fresh-setup dist/fresh-setup-macos-x86_64
          arch -x86_64 ./dist/fresh-macos-x86_64 -c 'echo intel says $(uname -m)' || echo "no rosetta on this runner"
          ls -la dist

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos
          path: dist/*
          retention-days: 90

  linux:
    needs: expectations
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Resolve version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${INPUT_VERSION:-0.0.0-dev}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          sed -i "s/#define FRESH_VERSION \".*\"/#define FRESH_VERSION \"$VERSION\"/" src/shell.h

      - name: Build the Rust core
        shell: bash
        run: |
          rustc --version
          cd rust/core
          cargo build --release --target "$(rustc -vV | sed -n 's/^host: //p')"

      - name: Build with borrow checking and run the suite under it
        timeout-minutes: 10
        shell: bash
        run: |
          chmod +x build.sh
          FRESH_EXTRA_CFLAGS=-DFRESH_BORROWS ./build.sh
          ./build/fresh tests/run.frsh

      - name: Build
        shell: bash
        run: |
          FRESH_STATIC=1 ./build.sh
          test -f build/fresh
          file build/fresh build/fresh-setup
          ldd build/fresh || true

      - name: Smoke test
        shell: bash
        run: |
          ./build/fresh --version
          ./build/fresh -c 'echo hello from $(pwd)'
          ./build/fresh -c 'for i in 1 2 3; do echo $i; done | tr 1 x'
          ./build/fresh -c 'uname -sm; whoami; command -v ls'
          ./build/fresh-setup --silent --user
          test -x "$HOME/.local/bin/fresh"
          "$HOME/.local/bin/fresh" --version
          grep -c 'FreSH setup' "$HOME/.profile" "$HOME/.bashrc" || true
          ./build/fresh-setup --silent --uninstall
          test ! -e "$HOME/.local/bin/fresh"

      - name: Test suite
        timeout-minutes: 10
        shell: bash
        run: ./build/fresh tests/run.frsh

      - uses: actions/download-artifact@v4
        with:
          name: bash-expectations
          path: tests/diff/expected

      - name: Differential test against bash
        shell: bash
        run: |
          chmod +x tests/diff/*.sh
          tests/diff/record.sh "$PWD/build/fresh" tests/diff/actual
          tests/diff/compare.sh tests/diff/expected tests/diff/actual

      - name: Name the binary
        shell: bash
        run: |
          mkdir -p dist
          cp build/fresh dist/fresh-linux-${{ matrix.arch }}
          cp build/fresh-setup dist/fresh-setup-linux-${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*
          retention-days: 90

  release:
    runs-on: ubuntu-latest
    needs: [windows, macos, linux]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${INPUT_VERSION:-0.0.0-dev}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          if [[ "$VERSION" == *-* ]]; then echo "PRERELEASE=true" >> $GITHUB_ENV
          else echo "PRERELEASE=false" >> $GITHUB_ENV; fi

      - uses: actions/download-artifact@v4
        with:
          pattern: '{windows-*,macos,linux-*}'
          path: dist
          merge-multiple: true

      - name: Checksums
        shell: bash
        run: |
          cd dist
          chmod +x fresh-*
          sha256sum FreSH.exe FreSH-Setup.exe FreSH-arm64.exe FreSH-Setup-arm64.exe \
                    fresh-macos-arm64 fresh-macos-x86_64 fresh-linux-x86_64 fresh-linux-arm64 \
                    fresh-setup-macos-arm64 fresh-setup-macos-x86_64 \
                    fresh-setup-linux-x86_64 fresh-setup-linux-arm64 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/attest-build-provenance@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          subject-path: |
            dist/FreSH.exe
            dist/FreSH-Setup.exe
            dist/FreSH-arm64.exe
            dist/FreSH-Setup-arm64.exe
            dist/fresh-macos-arm64
            dist/fresh-macos-x86_64
            dist/fresh-linux-x86_64
            dist/fresh-linux-arm64
            dist/fresh-setup-macos-arm64
            dist/fresh-setup-macos-x86_64
            dist/fresh-setup-linux-x86_64
            dist/fresh-setup-linux-arm64

      - name: Update the package manifests
        if: startsWith(github.ref, 'refs/tags/v') && env.PRERELEASE == 'false'
        shell: bash
        run: |
          hash() { grep -E "[ *]$1\$" dist/SHA256SUMS.txt | cut -d' ' -f1; }
          bash tools/manifests.sh "$VERSION" "$(hash FreSH-Setup.exe)" "$(hash FreSH.exe)" \
                                  "$(hash FreSH-Setup-arm64.exe)" "$(hash FreSH-arm64.exe)"
          git diff --stat

      - name: Submit the winget packages
        if: startsWith(github.ref, 'refs/tags/v') && env.PRERELEASE == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "WINGET_TOKEN is not set, so the winget pull requests are not opened"
            echo "see manifests/README.md for opening them by hand"
            exit 0
          fi
          bash tools/winget-submit.sh "$VERSION"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: FreSH v${{ env.VERSION }}
          draft: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_type == 'draft' }}
          prerelease: ${{ env.PRERELEASE == 'true' || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_type == 'prerelease') }}
          generate_release_notes: true
          files: |
            dist/FreSH-Setup.exe
            dist/FreSH.exe
            dist/FreSH-Setup-arm64.exe
            dist/FreSH-arm64.exe
            dist/fresh-macos-arm64
            dist/fresh-macos-x86_64
            dist/fresh-linux-x86_64
            dist/fresh-linux-arm64
            dist/fresh-setup-macos-arm64
            dist/fresh-setup-macos-x86_64
            dist/fresh-setup-linux-x86_64
            dist/fresh-setup-linux-arm64
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
