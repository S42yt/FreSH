name: Benchmarks

on:
  push:
    branches: ['feat/**', 'perf/**']
  workflow_dispatch:

jobs:
  bench:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
          update: true

      - name: Add the Rust target the C linker can use
        shell: bash
        run: rustup target add x86_64-pc-windows-gnu

      - name: Build the Rust core
        shell: bash
        run: |
          cd rust/core
          cargo build --release --target x86_64-pc-windows-gnu

      - name: Build
        shell: msys2 {0}
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Size and core
        shell: bash
        run: |
          ls -l build/FreSH.exe
          ./build/FreSH.exe --norc -c 'fresh' | grep 'rust core'

      - name: Test suite
        shell: bash
        run: ./build/FreSH.exe tests/run.frsh

      - name: Startup against cmd
        shell: bash
        run: |
          ./build/FreSH.exe --norc tools/bench-startup.frsh "$PWD/build/FreSH.exe" 60 --norc | tee startup.txt
          ./build/FreSH.exe --norc tools/bench-startup.frsh cmd.exe 60 --cmd | tee -a startup.txt

      - name: Core work
        shell: bash
        run: ./build/FreSH.exe --norc tools/bench-core.frsh 10 | tee work.txt

      - name: Utilities
        shell: bash
        run: ./build/FreSH.exe --norc tools/bench-utils.frsh 5 | tee utils.txt

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Benchmarks'
            echo '### Startup'
            echo '```'
            cat startup.txt 2> /dev/null || echo 'not measured'
            echo '```'
            echo '### Core work'
            echo '```'
            cat work.txt 2> /dev/null || echo 'not measured'
            echo '```'
            echo '### Utilities'
            echo '```'
            cat utils.txt 2> /dev/null || echo 'not measured'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench
          path: |
            build/FreSH.exe
            startup.txt
            work.txt
            utils.txt
          retention-days: 30
